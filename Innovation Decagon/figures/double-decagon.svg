<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">The Double Decagon</title>
<desc id="desc">Two concentric decagons. The inner ring holds Volume I's ten design obligations; the outer ring holds ten future-fitness tests. Each vertex scores 0 to 5, for 100 points in total.</desc>
<rect width="1000" height="1000" fill="#fcfcfb"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0b0b0b">The Double Decagon</text>
<text x="40" y="80" font-size="15" fill="#52514e">Ten design obligations (Volume I) inside ten future-fitness tests (Volume II). Each vertex scores 0–5; the index is out of 100.</text>
<rect x="40" y="102" width="22" height="14" fill="#e8eff9" stroke="#2a78d6" stroke-width="2"/>
<text x="72" y="114" font-size="14" fill="#0b0b0b">Inner ring: is it well designed? (50 points)</text>
<rect x="40" y="128" width="22" height="14" fill="#fdf1ea" stroke="#eb6834" stroke-width="2"/>
<text x="72" y="140" font-size="14" fill="#0b0b0b">Outer ring: will it thrive in 2030–2050? (50 points)</text>
