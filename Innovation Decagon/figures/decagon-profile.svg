<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">The Innovation Decagon: first-generation platforms vs the ten Decagon ventures</title>
<desc id="desc">Ten-axis profile scored 0 to 5. First generation (Uber and Airbnb around 2012, average 30.5 of 50) is strong on the engine vertices and weak on the conscience vertices. The ten ventures (average 42.3 of 50) are balanced, but lower on liquidity and antifragility.</desc>
<rect width="960" height="900" fill="#fcfcfb"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0b0b0b">The Innovation Decagon</text>
<text x="40" y="80" font-size="15" fill="#52514e">Average score per vertex (0–5). Engine vertices create and move value; conscience vertices distribute and sustain it.</text>
<line x1="40" y1="112" x2="74" y2="112" stroke="#2a78d6" stroke-width="3"/>
